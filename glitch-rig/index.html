<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glitch Rig</title>
  <meta name="description" content="Looks, transitions and titles for After Effects and Premiere Pro. Pick a card, tune it on the display, hit APPLY.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&family=VT323&family=DotGothic16&family=Bungee&family=Rubik+Mono+One&family=Metal+Mania&family=Monoton&family=Orbitron:wght@900&family=Pirata+One&family=Abril+Fatface&family=UnifrakturMaguntia&family=Rubik+Bubbles&display=swap">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div id="fit">
    <main class="rig" id="rig" aria-label="Glitch Rig panel">
      <span class="screw s-tl"></span><span class="screw s-tr"></span><span class="screw s-bl"></span><span class="screw s-br"></span>

      <!-- LEFT: brand, sections, cards -->
      <section class="col-left">
        <header class="brand">
          <div class="brand-plate">
            <span class="brand-name">GLITCH</span>
            <span class="brand-fx">RIG</span>
          </div>
          <div class="brand-sub">LOOKS · TRANSITIONS · TITLES</div>
        </header>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
          <button class="tab" role="tab" data-tab="looks"><i class="led"></i>LOOKS</button>
          <button class="tab" role="tab" data-tab="transitions"><i class="led"></i>TRANSITIONS</button>
          <button class="tab" role="tab" data-tab="titles"><i class="led"></i>TITLES</button>
        </nav>
        <div class="well">
          <div class="cards" id="cards" role="listbox" aria-label="Cards"></div>
        </div>
      </section>

      <!-- CENTER: screen + display -->
      <section class="col-mid">
        <div class="crt">
          <div class="crt-glass">
            <canvas id="screen" aria-label="Preview"></canvas>
            <div class="crt-lines"></div>
            <div class="crt-shine"></div>
            <div class="chip" id="chip"><i></i><span>LIVE</span></div>
            <div class="card-name" id="cardName"></div>
          </div>
          <div class="crt-foot">
            <span class="crt-badge">GR·CRT</span>
            <span class="crt-knob"></span><span class="crt-knob"></span>
          </div>
        </div>
        <div class="vfd" id="vfd">
          <div class="vfd-text" id="vfdText" hidden>
            <label for="words" id="wordsLabel">TYPE</label>
            <input id="words" type="text" maxlength="80" spellcheck="false" autocomplete="off">
          </div>
          <div class="vfd-grid" id="controls"></div>
          <div class="vfd-pager" id="pager">
            <button class="pg" id="pgPrev" aria-label="Previous page">◀</button>
            <span id="pgText">1/1</span>
            <button class="pg" id="pgNext" aria-label="Next page">▶</button>
          </div>
        </div>
      </section>

      <!-- RIGHT: source, switches, apply -->
      <section class="col-right">
        <div class="source">
          <div class="mini-lcd" id="srcName">DEMO · NIGHT</div>
          <div class="src-btns" id="srcBtns">
            <button class="key" data-src="demo">DEMO</button>
            <button class="key" data-src="file">FILE</button>
            <button class="key" data-src="cam">CAM</button>
          </div>
          <div class="src-btns" id="srcBtnsB">
            <button class="key key-wide" data-src="fileB">CLIP B…</button>
          </div>
          <div class="src-btns" id="hostBtns" hidden>
            <button class="key key-wide" id="grab">GRAB SELECTED</button>
          </div>
          <input type="file" id="fileA" accept="video/*" hidden>
          <input type="file" id="fileB" accept="video/*" hidden>
        </div>
        <div class="switches">
          <div class="sw" data-sw="pause"><span class="sw-label">PAUSE</span><button class="lever" aria-pressed="false" aria-label="Pause"></button></div>
          <div class="sw" data-sw="random"><span class="sw-label">RANDOM</span><button class="lever" aria-label="Randomise"></button></div>
          <div class="sw" data-sw="reset"><span class="sw-label">RESET</span><button class="lever" aria-label="Reset"></button></div>
        </div>
        <div class="apply">
          <span class="sw-label">APPLY</span>
          <button class="apply-btn" id="apply" aria-label="Apply"><span></span></button>
          <div class="apply-note" id="applyNote">RENDER TO WEBM</div>
        </div>
        <button class="mute" id="mute" aria-label="Sound on/off">SND ON</button>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- classic scripts: CEP serves this page over file://, where ES modules are blocked -->
  <script src="js/core/gl.js"></script>
  <script src="js/core/post.js"></script>
  <script src="js/core/glyphs.js"></script>
  <script src="js/core/sources.js"></script>
  <script src="js/effects/common.js"></script>
  <script src="js/effects/dotmatrix.js"></script>
  <script src="js/effects/grades.js"></script>
  <script src="js/effects/trip.js"></script>
  <script src="js/effects/clones.js"></script>
  <script src="js/effects/blob.js"></script>
  <script src="js/effects/handframe.js"></script>
  <script src="js/effects/mosh.js"></script>
  <script src="js/effects/transitions.js"></script>
  <script src="js/effects/titles.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/player.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/host.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
